# Runs the exact student command on a clean Windows machine and checks that
# SimForge installs, updates idempotently, and starts without crashing.
name: Test Windows updater

on:
  workflow_dispatch:
  push:
    paths: ["update.ps1", ".github/workflows/test-updater.yml"]
  release:
    types: [published]

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell   # Windows PowerShell 5.1, what students have
    steps:
      - name: Install with the student command
        run: |
          irm https://raw.githubusercontent.com/engrniel/simforge-releases/main/update.ps1 | iex

      - name: Check installed files, version and shortcut
        run: |
          $dir = Join-Path $env:LOCALAPPDATA "Programs\SimForge"
          $want = (Invoke-WebRequest "https://github.com/engrniel/simforge-releases/releases/latest/download/version.txt" -UseBasicParsing).Content
          if ($want -is [byte[]]) { $want = [Text.Encoding]::UTF8.GetString($want) }
          $want = $want.Trim()
          $got = (Get-Content (Join-Path $dir "version.txt") -Raw).Trim()
          Write-Host "latest=$want installed=$got"
          if ($got -ne $want) { throw "version mismatch" }
          foreach ($f in "SimForge.exe","engine_server.py","mdemo.py","mdsp.py","msim.py","mtypes.py","mcircuit.py","mmat.py","mplot3.py") {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "missing $f" }
          }
          $lnk = Join-Path ([Environment]::GetFolderPath("StartMenu")) "Programs\SimForge.lnk"
          if (-not (Test-Path $lnk)) { throw "missing Start Menu shortcut" }
          Get-ChildItem $dir | Format-Table Name, Length

      - name: Second run says already up to date
        run: |
          $out = (irm https://raw.githubusercontent.com/engrniel/simforge-releases/main/update.ps1 | iex) *>&1 | Out-String
          Write-Host $out
          if ($out -notmatch "already the latest") { throw "second run did not detect the installed version" }

      - name: Engine runs MATLAB code on Windows Python
        run: |
          $dir = Join-Path $env:LOCALAPPDATA "Programs\SimForge"
          $req = @(
            '{"id":1,"kind":"status"}',
            '{"id":2,"kind":"run","code":"x = linspace(0,1,5);\r\ndisp(sum(x))\r\nA = [1 2;\r\n 3 4];\r\ndisp(det(A))\r\nfor k=1:3, fprintf(''k=%d\\n'',k); end\r\nhistogram(randn(1,100));"}'
          ) -join "`n"
          $out = $req | python -X utf8 (Join-Path $dir "engine_server.py") | Out-String
          Write-Host $out
          if ($out -notmatch '"id": 2') { throw "no reply to the run request" }
          if ($out -notmatch '2\.5') { throw "sum(x) not printed" }
          if ($out -notmatch '-2') { throw "det(A) not printed" }
          if ($out -notmatch 'k=3') { throw "for loop output missing" }
          if ($out -match '"error": "[^"]') { throw "engine returned an error" }

      - name: SimForge.exe starts and stays up
        run: |
          $dir = Join-Path $env:LOCALAPPDATA "Programs\SimForge"
          $log = Join-Path $env:TEMP "simforge-crash.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process (Join-Path $dir "SimForge.exe") -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "SimForge.exe exited with code $($p.ExitCode)" }
          $eng = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like "*engine_server.py*" }
          $eng | Format-Table ProcessId, Name, CommandLine -AutoSize | Out-String -Width 300 | Write-Host
          if (-not $eng) { throw "engine process not running" }
          if (Test-Path $log) { Get-Content $log; throw "crash log written" }
          Write-Host "SimForge.exe pid $($p.Id) running, engine up, no crash log"

      - name: Update closes a running SimForge
        run: |
          $dir = Join-Path $env:LOCALAPPDATA "Programs\SimForge"
          Set-Content (Join-Path $dir "version.txt") "0.0.0"
          $out = (irm https://raw.githubusercontent.com/engrniel/simforge-releases/main/update.ps1 | iex) *>&1 | Out-String
          Write-Host $out
          if ($out -notmatch "Updating SimForge 0\.0\.0") { throw "did not update" }
          if ($out -match "Update failed") { throw "update failed" }
          if (Get-Process SimForge -ErrorAction SilentlyContinue) { throw "SimForge still running after update" }
